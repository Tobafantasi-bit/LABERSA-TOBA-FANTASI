<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBA FANTASI /title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navigasi -->
    <header>
        <div class="logo">LABERSA TOBA</div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <h1>LABERSA TOBA FANTASI</h1>
        <p>Jl. Saribu Raja Janji Maria - Jalan Raya Pematang Siantar-Balige, Kecamatan Balige, Kabupaten Toba, Sumatera Utara</p>
        <a href="#projects" class="btn">Lihat Promo</a>
    </section>

    <!-- Project Section -->
    <section id="projects" class="projects">
        <h2>PROMO 2026</h2>
        <div class="grid">
            <div class="card">
                <h3>WATERPARK</h3>
                <p>09.00-17.00.</p>
            </div>
            <div class="card">
                <h3>THEMEPARK</h3>
                <p>10.00-18.00.</p>
            </div>
            <div class="card">
                <h3>SPORT CENTER</h3>
                <p>09.00-22.00</p>
            </div>
        </div>
    </section>

        <!-- Booking Section -->
    <section id="booking" class="booking-section">
        <h2>Form Booking Online</h2>
        <p>Silakan isi formulir di bawah ini untuk memesan layanan kami.</p>
        
        <div class="booking-container">
            <form id="bookingForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="name">Nama Lengkap</label>
                    <input type="text" id="name" required placeholder="Masukkan nama Anda">
                </div>
                
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" required placeholder="nama@email.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Tanggal Booking</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label for="service">Pilih Layanan</label>
                        <select id="service" required>
                            <option value="">-- Pilih Layanan --</option>
                            <option value="uiux">Desain UI/UX</option>
                            <option value="webdev">Web Development</option>
                            <option value="branding">Branding & Logo</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Catatan Tambahan (Opsional)</label>
                    <textarea id="notes" rows="4" placeholder="Detail atau request khusus..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Kirim Pesanan</button>
            </form>
            <div id="successMessage" class="success-box hidden">
                <h3>🎉 Booking Berhasil!</h3>
                <p>Terima kasih. Kami akan segera menghubungi Anda melalui email.</p>
            </div>
        </div>
    </section>
<!-- Footer -->
    <footer>
        <p>&copy; 2026 Roy_Manalu. Dibuat dengan ❤️ untuk Labersa Toba Fantasi Pages.</p>
    </footer>

</body>
</html>
